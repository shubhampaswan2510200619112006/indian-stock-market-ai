version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: indian_options_db
    environment:
      POSTGRES_DB: indian_options_ai
      POSTGRES_USER: options_user
      POSTGRES_PASSWORD: options_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U options_user -d indian_options_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
