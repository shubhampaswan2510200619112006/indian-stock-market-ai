<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indian Stock Market AI — Flagship Quantitative Trading Terminal</title>
    <meta name="description" content="Institutional-grade quantitative research, options intelligence, Black-76 Greeks, and live execution terminal for NSE India." />
    <meta name="theme-color" content="#080B12" />

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Critical inline styles — prevent flash -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #02040a;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Initial loading screen */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #02040a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.4s ease;
      }
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Electric Lime shimmer logo */
      .load-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(182,255,92,0.15) 0%, #101622 100%);
        border: 1px solid rgba(182,255,92,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -1px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(182,255,92,0.15);
      }
      .load-logo::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: shimmer-sweep 1.6s ease-in-out infinite;
      }
      @keyframes shimmer-sweep {
        from { left: -60%; }
        to { left: 130%; }
      }
      .load-logo span {
        background: linear-gradient(175deg, #ffffff 0%, #B6FF5C 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .load-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #929DB0;
        text-transform: uppercase;
      }
      .load-bar {
        width: 120px;
        height: 2px;
        background: #161F2D;
        border-radius: 2px;
        overflow: hidden;
      }
      .load-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #43D9FF, #B6FF5C);
        border-radius: 2px;
        animation: load-progress 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.1s;
      }
      @keyframes load-progress {
        from { width: 0%; }
        to { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Initial loading screen (fades out after React mounts) -->
    <div id="app-loading">
      <div class="load-logo"><span>IM</span></div>
      <div class="load-text">INITIALIZING TERMINAL</div>
      <div class="load-bar"><div class="load-bar-fill"></div></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Dismiss loading screen once React is ready -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const el = document.getElementById('app-loading');
          if (el) {
            el.classList.add('fade-out');
            setTimeout(() => el.remove(), 500);
          }
        }, 800);
      });

      // Streamlit iframe auto-resizer and handshake
      function notifyStreamlitReady() {
        try {
          const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, 1200);
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height: h
          }, "*");
        } catch(e) {}
      }
      try {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1
        }, "*");
      } catch(e) {}
      window.addEventListener('load', notifyStreamlitReady);
      window.addEventListener('resize', notifyStreamlitReady);
      setInterval(notifyStreamlitReady, 2500);
    </script>
  </body>
</html>
